name: Closure receiver parameters

on:
  push:
    branches: [feature/closure-receiver-parameters]
    paths:
      - 'Sources/**'
      - 'Tests/**'
      - 'CodeGeneration/**'
      - 'Package.swift'
      - '.github/workflows/closure_receiver_parameters.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: closure-receiver-parameters-${{ github.ref }}
  cancel-in-progress: true

jobs:
  parser:
    name: Parser and generated schema
    runs-on: ubuntu-latest
    timeout-minutes: 40
    container:
      # Swift 6.4.1, recorded from the initial CI run.
      image: swift@sha256:82152e9f18ee21fc997fd4580b93a14097e465cb10d7a7eee3f2dc85364dd135
    env:
      SKIP_LONG_TESTS: '1'
      SWIFTSYNTAX_ENABLE_RAWSYNTAX_VALIDATION: '1'
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Record toolchain
        run: swift --version
      - name: Test parser
        # Serial SwiftPM filtering expands the whole suite into one argument,
        # exceeding Linux's per-argument size limit. Workers run one test each.
        run: swift test -j 2 --parallel --num-workers 2 --filter SwiftParserTest
      - name: Test schema
        run: swift test --package-path CodeGeneration -j 2 --filter ValidateSyntaxNodes
      - name: Verify generated sources
        run: |
          swift run --package-path CodeGeneration -j 2 generate-swift-syntax
          git -c safe.directory="$GITHUB_WORKSPACE" -C "$GITHUB_WORKSPACE" diff --exit-code
